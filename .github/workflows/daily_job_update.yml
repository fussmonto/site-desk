name: Daily Job Update

on:
  schedule:
    - cron: "30 6 * * *"   # 06:30 UTC = 12:00 PM IST (GitHub may start it a few minutes late)
  workflow_dispatch:        # lets you run it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: job-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch and score jobs
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: python scraper.py

      - name: Commit updated jobs.json (this refreshes the website)
        run: |
          git config user.name  "job-digest-bot"
          git config user.email "job-digest-bot@users.noreply.github.com"
          git add jobs.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily job update $(date -u +'%Y-%m-%d')"
            git push
          fi

      - name: Send email digest
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          PAGES_URL: ${{ vars.PAGES_URL }}
        run: python send_email.py
